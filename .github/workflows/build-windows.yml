name: Build Windows App

# Lives at .github/workflows/build-windows.yml; everything else at the repo root.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Windows runners print through cp1252; make every Python step use UTF-8.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-windows.txt
          pip install pyinstaller==6.11.1

      - name: Sanity-check the app and launcher
        run: |
          python -m py_compile SalesManager.py
          python -m py_compile FeedStoreSales.py
          python -m py_compile run_desktop.py
          python -m py_compile ci_smoke_test.py
          python -c "compile(open('build_windows.spec').read(), 'spec', 'exec')"
          python -c "s=open('SalesManager.py',encoding='utf-8').read(); assert s.count(chr(39)*3)==0, 'triple-single-quotes in app source'; print('app source clean')"

      - name: Check the numpy / pandas pairing (prevents the frozen tslibs ImportError)
        run: |
          python -c "import numpy, pandas; print('numpy', numpy.__version__, '| pandas', pandas.__version__); assert numpy.__version__.startswith('1.'), 'numpy must be 1.x for a stable frozen build'; import pandas._libs.tslibs.offsets; print('pandas._libs.tslibs.offsets imports: ok')"

      - name: Check the export / import libraries work before building
        run: |
          python -c "import reportlab; print('reportlab:', reportlab.Version)"
          python -c "import plotly; print('plotly:', plotly.__version__)"
          python -c "import PIL; print('pillow: ok')"
          python -c "import openpyxl; print('openpyxl:', openpyxl.__version__)"
          python -c "import zoneinfo, tzdata; zoneinfo.ZoneInfo('Africa/Gaborone'); print('tzdata: Africa/Gaborone ok')"

      - name: Smoke-test every page, tab and export with the real Streamlit
        run: python ci_smoke_test.py

      - name: Build the executable
        run: pyinstaller build_windows.spec --noconfirm --clean

      - name: Confirm the export libraries were bundled
        run: |
          $missing = @()
          foreach ($lib in 'reportlab', 'plotly', 'pandas', 'openpyxl') {
            $hit = Get-ChildItem -Path dist\SalesManager -Recurse -Force -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -like "*\$lib*" } | Select-Object -First 1
            if ($null -eq $hit) { $missing += $lib } else { Write-Host "$lib bundled" }
          }
          if ($missing.Count -gt 0) {
            throw "Not bundled into the .exe: $($missing -join ', '). PDF/CSV/Excel features would be missing at runtime."
          }
        shell: pwsh

      - name: Confirm the executable exists
        run: |
          if (-not (Test-Path 'dist\SalesManager\SalesManager.exe')) {
            throw 'dist\SalesManager\SalesManager.exe was not produced'
          }
          Write-Host 'SalesManager.exe built'
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SalesManager-installer
          path: Output\SalesManagerSetup.exe
          if-no-files-found: error
          retention-days: 30
